name: Method C public video browser capture
on:
  pull_request:
    paths:
      - 'scripts/capture_browser_frames.cjs'
      - 'scripts/select_browser_frames.py'
      - '.github/workflows/browser-frame-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: method-c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - run: python -m pip install Pillow==11.2.1
      - name: Create local playback test only (not website material)
        run: |
          mkdir -p /tmp/capture-fixture
          ffmpeg -nostdin -v error -f lavfi -i testsrc2=size=640x360:rate=25 -t 32 -c:v libvpx-vp9 -b:v 500k /tmp/capture-fixture/test.webm
          printf '<video controls muted autoplay src="test.webm" width="640" height="360"></video>' > /tmp/capture-fixture/index.html
          python -m http.server 8766 --directory /tmp/capture-fixture > /tmp/capture-server.log 2>&1 &
      - name: Capture ordinary playback in virtual display
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/capture_browser_frames.cjs
      - name: Rank and grade capture candidates
        if: always()
        run: python scripts/select_browser_frames.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: method-c-capture-review
          path: browser-capture/
          retention-days: 7
          if-no-files-found: warn
