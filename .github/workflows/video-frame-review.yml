name: Official video frame extraction
on:
  pull_request:
    paths:
      - 'scripts/extract_video_frames.py'
      - '.github/workflows/video-frame-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-frame-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed Ubuntu FFmpeg package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
          python -m pip install 'Pillow==11.2.1'
      - name: Verify extraction without account credentials
        run: python scripts/extract_video_frames.py --self-test
      - name: Acquire authorized Instagram account videos
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'design/premium-editorial-v1'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/extract_video_frames.py --instagram
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-video-frame-review
          path: video-review/
          if-no-files-found: warn
          retention-days: 7
