name: Event browser QA
on:
  pull_request:
    paths:
      - 'events/**'
      - 'en/**'
      - 'index.html'
      - 'style.css'
      - 'images/**'
      - 'sitemap.xml'
      - '.github/workflows/event-browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: event-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify editorial photo provenance and source links
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from html.parser import HTMLParser
          class Gallery(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside=False
                  self.images=[]
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='section':
                      self.inside=a.get('id')=='gallery'
                  if self.inside and tag=='img': self.images.append(a.get('src'))
                  if self.inside and tag=='a': self.links.append(a.get('href'))
              def handle_endtag(self, tag):
                  if tag=='section': self.inside=False
          gallery=Gallery()
          gallery.feed(Path('index.html').read_text())
          records=json.loads(Path('images/editorial/provenance.json').read_text())
          assert len(records)==3
          assert len({x['path'] for x in records})==3
          for r in records:
              p=Path(r['path'])
              assert p.parent==Path('images/editorial')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256'],p
              assert r['path'] in gallery.images,p
              if r['source_type']=='official_video_thumbnail_not_direct_frame':
                  assert r['source_url'] in gallery.links,p
              else:
                  assert r['source_type']=='owner_supplied_video_frame',p
                  assert len(r['source_video_sha256'])==64 and r['nominal_second']>=0,p
                  assert r['location_verified'] is False,p
          print('Editorial source and image SHA verification PASS: 3/3')
          PY
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/site/glendalough screenshots
          git ls-files images > screenshots/image-inventory.txt
          cat screenshots/image-inventory.txt
          cp -a index.html style.css events en images sitemap.xml /tmp/site/glendalough/
          mkdir -p /tmp/site/baseline
          cp -a baseline/index.html baseline/style.css baseline/events baseline/en baseline/images baseline/sitemap.xml /tmp/site/baseline/
          python3 -m http.server 8765 --directory /tmp/site > /tmp/server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            try {
              for(const width of [320,390,768,1280,1440,1650,1920]){
                const page=await browser.newPage({viewport:{width,height:900}});
                await page.goto('http://127.0.0.1:8765/glendalough/',{waitUntil:'domcontentloaded'});
                await page.addStyleTag({content:'.reveal{opacity:1!important;transform:none!important}'});
                await page.emulateMedia({reducedMotion:'reduce'});
                await page.evaluate(()=>document.fonts.ready);
                await page.screenshot({path:'screenshots/candidate-hero-'+width+'.png'});
                const baseline=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                await baseline.goto('http://127.0.0.1:8765/baseline/',{waitUntil:'domcontentloaded'});
                await baseline.evaluate(()=>document.fonts.ready);
                await baseline.screenshot({path:'screenshots/baseline-hero-'+width+'.png'});
                if([1440,1650].includes(width)){
                  await baseline.addStyleTag({content:'.reveal{opacity:1!important;transform:none!important}'});
                  await baseline.evaluate(async()=>{for(const i of document.querySelectorAll('#about img,#music .music-card-image img,#performance .performance-photo img')){i.loading='eager';await i.decode()}});
                  await baseline.locator('#about .about-grid').screenshot({path:'screenshots/before-about-'+width+'.png'});
                  await baseline.locator('#music .music-card-grid').first().screenshot({path:'screenshots/before-music-'+width+'.png'});
                  await baseline.locator('#performance').screenshot({path:'screenshots/before-performance-'+width+'.png'});
                }
                if([390,1440,1650].includes(width)){
                  await baseline.addStyleTag({content:'.reveal{opacity:1!important;transform:none!important}'});
                  await baseline.locator('.sns-section').screenshot({path:'screenshots/before-social-'+width+'.png'});
                }
                await baseline.close();
                const overflow=await page.evaluate(()=>({viewport:innerWidth,document:document.documentElement.scrollWidth,offenders:[...document.querySelectorAll('body *')].map(e=>({tag:e.tagName,cls:String(e.className),right:e.getBoundingClientRect().right,left:e.getBoundingClientRect().left,width:e.scrollWidth})).filter(e=>e.right>innerWidth+1||e.left< -1).slice(0,60)})); require('node:fs').writeFileSync('screenshots/overflow-'+width+'.json',JSON.stringify(overflow,null,2)); console.log('OVERFLOW',JSON.stringify(overflow)); assert(overflow.document<=width,'Home horizontal overflow at '+width);
                assert.equal(await page.locator('#event').getAttribute('required'),null);
                const optimized=await page.evaluate(async()=>{const imgs=[...document.querySelectorAll('img[srcset*="images/web/"]')];await Promise.all(imgs.map(async i=>{i.loading='eager';await i.decode()}));return imgs.map(i=>({src:i.currentSrc,width:i.naturalWidth}))});
                assert.equal(optimized.length,4);
                assert(optimized.every(i=>i.width>0 && i.src.endsWith('.webp')));
                const gallery=await page.evaluate(async()=>{const imgs=[...document.querySelectorAll('#gallery img')];return Promise.all(imgs.map(async i=>{i.loading='eager';try{await i.decode()}catch{}return {src:i.getAttribute('src'),width:i.naturalWidth}}))});
                assert.equal(gallery.length,6); require('node:fs').writeFileSync('screenshots/gallery-decode-'+width+'.json',JSON.stringify(gallery,null,2)); assert(gallery.every(i=>i.width>0),JSON.stringify(gallery));
                await page.evaluate(async()=>{for(const i of document.images)i.loading='eager';await Promise.allSettled([...document.images].map(i=>i.decode()));});
                const composition=await page.evaluate(()=>{
                  const images=[...document.querySelectorAll('#about .about-image img,#music .music-card-image img,#performance .performance-photo img')];
                  return images.map(i=>{
                    const r=i.getBoundingClientRect(),p=i.parentElement.getBoundingClientRect(),cs=getComputedStyle(i);
                    const natural=i.naturalWidth/i.naturalHeight,display=r.width/r.height;
                    return {src:i.getAttribute('src'),natural,display,width:r.width,height:r.height,fit:cs.objectFit,transform:cs.transform,ratioError:Math.abs(display/natural-1),withinParent:r.left>=p.left-1&&r.right<=p.right+1&&r.top>=p.top-1&&r.bottom<=p.bottom+1};
                  });
                });
                assert.equal(composition.length,8);
                assert(composition.every(x=>x.width>0&&x.height>0&&x.fit==='contain'&&x.transform==='none'&&x.ratioError<0.012&&x.withinParent),JSON.stringify(composition));
                for(const card of await page.locator('#music .music-card').all()){
                  await card.hover();
                  assert.equal(await card.locator('img').evaluate(i=>getComputedStyle(i).transform),'none','Image clipped on hover');
                }
                await page.mouse.move(0,0);
                require('node:fs').writeFileSync('screenshots/composition-'+width+'.json',JSON.stringify(composition,null,2));
                await page.locator('#about .about-grid').screenshot({path:'screenshots/about-'+width+'.png'});
                await page.locator('#music .music-card-grid').first().screenshot({path:'screenshots/music-ireland-'+width+'.png'});
                await page.locator('#music .music-card-grid').last().screenshot({path:'screenshots/music-beyond-'+width+'.png'});
                const visual=await page.evaluate(()=>({logo:[...document.querySelectorAll('.header .logo-image')].map(e=>({loaded:e.naturalWidth>0,height:e.getBoundingClientRect().height,width:e.getBoundingClientRect().width})),captions:[...document.querySelectorAll('#gallery figcaption')].map(e=>({text:e.textContent,visible:e.getBoundingClientRect().height>0,fit:e.scrollWidth<=e.clientWidth&&e.scrollHeight<=e.clientHeight})),brokenLocal:[...document.images].filter(i=>new URL(i.src).origin===location.origin&&!i.naturalWidth).map(i=>i.src)}));
                require('node:fs').writeFileSync('screenshots/visual-contract-'+width+'.json',JSON.stringify(visual,null,2));
                assert(visual.logo.length>0 && visual.logo.every(i=>i.loaded&&i.height>=32&&i.width>0),'Logo visibility');
                assert.equal(visual.captions.length,6);
                assert(visual.captions.every(i=>i.visible&&i.fit),'Gallery caption clipping');
                assert.equal(visual.brokenLocal.length,0,JSON.stringify(visual.brokenLocal));
                await page.evaluate(()=>{document.activeElement.blur();document.querySelector('#gallery').scrollIntoView({block:'start',behavior:'instant'})});
                const anchorFit=await page.evaluate(()=>({sectionTop:document.querySelector('#gallery').getBoundingClientRect().top,headerBottom:document.querySelector('.header').getBoundingClientRect().bottom,skipOpacity:getComputedStyle(document.querySelector('.skip-link')).opacity}));
                assert(anchorFit.sectionTop>=anchorFit.headerBottom-1,JSON.stringify(anchorFit));
                assert.equal(anchorFit.skipOpacity,'0');
                await page.screenshot({path:'screenshots/gallery-anchor-'+width+'.png'});

                await page.locator('#gallery').screenshot({path:'screenshots/gallery-'+width+'.png'});
                // Documentary-first contract: performance background and gallery photo allowlist.
                assert.equal(await page.locator('#works .work-item').count(),3);
                assert.equal(await page.locator('#works img').count(),0);
                assert.equal(await page.locator('#music .music-art-label').count(),6);
                const documentary=await page.evaluate(async()=>{
                  const allowed=['images/web/hero-1280.webp','images/editorial/night-session.jpg','images/editorial/indoor-session.jpg','images/editorial/street-live.webp','images/image.jpg','images/live-20260910.jpg'];
                  const gallery=[...document.querySelectorAll('#gallery img')].map(e=>e.getAttribute('src'));
                  const image=document.querySelector('#performance .performance-photo img'); await image.decode();
                  const bg=image.currentSrc;
                  const ownerAllowed=['images/web/hero-1280.webp','images/editorial/night-city-live.webp','images/editorial/street-performance.webp','images/editorial/indoor-live-089s.webp','images/image.jpg','images/live-20260910.jpg'];
                  return {galleryMatch:JSON.stringify(gallery)===JSON.stringify(ownerAllowed),background:bg,backgroundWidth:image.naturalWidth,genreLabels:[...document.querySelectorAll('.music-art-label')].map(e=>({text:e.textContent,visible:e.getBoundingClientRect().height>0}))};
                });
                assert(documentary.galleryMatch,'Unexpected gallery source');
                assert(documentary.background.includes('/images/image.jpg')&&documentary.backgroundWidth>0,'Performance documentary photo unavailable');
                assert(documentary.genreLabels.every(x=>x.visible&&x.text==='音楽イメージ'));
                require('node:fs').writeFileSync('screenshots/documentary-'+width+'.json',JSON.stringify(documentary,null,2));
                const links=await page.evaluate(()=>{
                  const social=[...document.querySelectorAll('#social .sns-links a')].map(a=>({href:a.href,height:a.getBoundingClientRect().height,fit:a.scrollWidth<=a.clientWidth+1}));
                  const video=[...document.querySelectorAll('#music-video .film-source-link')].map(a=>a.href);
                  const reels=[...document.querySelectorAll('#live .past-film-link')].map(a=>a.href);
                  const anchors=[...document.querySelectorAll('a[href^="#"]')].filter(a=>a.getAttribute('href').length>1).map(a=>a.getAttribute('href')).filter(h=>!document.getElementById(h.slice(1)));
                  return {social,video,reels,anchors,headline:document.querySelector('#sns-title').getBoundingClientRect().width};
                });
                assert.equal(links.social.length,4);
                assert(links.social.every(a=>a.height>=44&&a.fit));
                assert.deepEqual(links.video,['https://www.youtube.com/watch?v=-btG-2M4QXQ','https://www.youtube.com/watch?v=L26X01zSNgo','https://www.youtube.com/watch?v=9d2jLKTgQtk']);
                assert.deepEqual(links.reels,['https://www.instagram.com/reel/Dbzb1vHzqWn/','https://www.instagram.com/reel/DYT5gg_TQML/']);
                assert.equal(links.anchors.length,0,JSON.stringify(links.anchors));
                assert.equal(await page.locator('#social .social-film-links').count(),0);
                assert.equal(await page.locator('.hero-live-link[href="#live"]').count(),1);
                assert.equal(await page.locator('.live-detail-links a').count(),2);
                await page.locator('#social .editorial-text-link').click();
                await page.waitForFunction(()=>location.hash==='#music-video');
                if(await page.locator('#menuButton').isVisible()){
                  await page.locator('#menuButton').click();
                  assert.equal(await page.locator('#menuButton').getAttribute('aria-expanded'),'true');
                  await page.keyboard.press('Escape');
                  assert.equal(await page.locator('#menuButton').getAttribute('aria-expanded'),'false');
                }
                require('node:fs').writeFileSync('screenshots/navigation-'+width+'.json',JSON.stringify(links,null,2));
                await page.locator('#social').screenshot({path:'screenshots/social-'+width+'.png'});
                await page.locator('#performance').screenshot({path:'screenshots/performance-section-'+width+'.png'});
                await page.locator('#works').screenshot({path:'screenshots/works-'+width+'.png'});

                await page.screenshot({path:'screenshots/home-'+width+'.png',fullPage:true});
                const metrics=await page.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return {domContentLoadedMs:n.domContentLoadedEventEnd,resources:performance.getEntriesByType('resource').map(r=>({url:r.name,transferBytes:r.transferSize,durationMs:r.duration})),images:[...document.images].map(i=>({src:i.getAttribute('src'),loading:i.loading}))}});
                require('node:fs').writeFileSync('screenshots/performance-'+width+'.json',JSON.stringify(metrics,null,2));
                const future=page.locator('.live-future'), recent=page.locator('.live-recent');
                assert(await future.count()===1 && await recent.count()===1);
                assert((await future.boundingBox()).y < (await recent.boundingBox()).y);
                assert((await recent.locator('.live-event-image').boundingBox()).width <= 180);
                assert(await page.locator('#date').getAttribute('required')===null);
                assert(await page.locator('#venue').getAttribute('required')===null);
                await page.locator('#live').screenshot({path:'screenshots/live-'+width+'.png',timeout:30000});
                assert.equal(await page.locator('link[hreflang="en"]').count(),1);
                await page.keyboard.press('Tab');
                await page.locator('.skip-link').focus();
                await page.waitForFunction(()=>{const e=document.querySelector('.skip-link');return document.activeElement===e && e.getBoundingClientRect().top>=0},{},{timeout:3000});
                const english=await page.goto('http://127.0.0.1:8765/glendalough/en/');
                assert.equal(english.status(),200);
                assert.equal(await page.locator('html').getAttribute('lang'),'en');
                assert(await page.locator('h1').isVisible());
                assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
                assert.equal(await page.locator('link[hreflang="ja"]').count(),1);
                assert(await page.locator('img[srcset]').evaluate(async i=>{await i.decode();return i.naturalWidth>0 && i.currentSrc.endsWith('.webp')}));
                await page.screenshot({path:'screenshots/english-'+width+'.png',fullPage:true});
                for(const day of ['24','25']){
                  const url='http://127.0.0.1:8765/glendalough/events/christmas-2026-'+day+'.html';
                  const response=await page.goto(url);
                  assert.equal(response.status(),200);
                  assert(await page.locator('h1').isVisible());
                  const schema=JSON.parse(await page.locator('script[type="application/ld+json"]').textContent());
                  assert.equal(schema['@type'],'MusicEvent');
                  assert(schema.startDate.includes('2026-12-'+day));
                  assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth && [...document.querySelectorAll('main h1,main dd,main a')].every(e=>e.scrollWidth<=e.clientWidth || getComputedStyle(e).display==='inline')));
                  await page.screenshot({path:'screenshots/'+day+'-'+width+'.png',fullPage:true});
                  assert.equal(await page.locator('a[href="../#live"]').count(),1);
                }
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-browser-screenshots
          path: screenshots/
