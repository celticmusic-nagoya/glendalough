name: Official media candidate review
on:
  pull_request:
    paths:
      - 'scripts/review_media.py'
      - '.github/workflows/media-review.yml'
permissions:
  contents: read
concurrency:
  group: media-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.2.1
      - run: python scripts/review_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-media-review
          path: media-review/
