name: Official media candidate review
on:
  pull_request:
    paths:
      - 'scripts/review_media.py'
      - '.github/workflows/media-review.yml'
permissions:
  contents: read
concurrency:
  group: media-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.2.1
      - run: python scripts/review_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-media-review
          path: media-review/

  stage-reviewed-stills:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'design/premium-editorial-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: official-media-review
          run-id: 45586588126
          github-token: ${{ github.token }}
          path: /tmp/reviewed-media
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.2.1
      - name: Stage only the two visually selected thumbnail derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance
          import hashlib, json
          src=Path('/tmp/reviewed-media')
          dst=Path('images/editorial')
          dst.mkdir(exist_ok=True)
          choices=[
              ('youtube--btG-2M4QXQ.webp','night-session.jpg','08972a7245096e2b6cace33c32978095d260d4aa00db6bbb24dfe973d3d18e3e',(438,280,842,690),1.22,'https://www.youtube.com/watch?v=-btG-2M4QXQ'),
              ('youtube-L26X01zSNgo.webp','indoor-session.jpg','ca57d04781d65a8a177c8f099a42a274404cec18b97f10b46dd4bdb387a1c1e6',(438,360,842,720),1.08,'https://www.youtube.com/watch?v=L26X01zSNgo'),
          ]
          records=[]
          for name,target,expected,box,brightness,url in choices:
              data=(src/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,name
              with Image.open(src/name) as im:
                  im=im.convert('RGB').crop(box)
              im=ImageEnhance.Brightness(im).enhance(brightness)
              im=ImageEnhance.Contrast(im).enhance(1.08)
              path=dst/target
              im.save(path,quality=88,optimize=True)
              with Image.open(path) as check: check.load(); assert check.size==(box[2]-box[0],box[3]-box[1])
              records.append(dict(path=str(path),source_url=url,source_type='official_video_thumbnail_not_direct_frame',review_artifact_id=15009490656,reviewed_source_sha256=expected,crop=box,brightness=brightness,contrast=1.08,sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          (dst/'provenance.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Commit candidate assets only to existing PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/design/premium-editorial-v1 | cut -f1)" = "$EXPECTED_HEAD"
          git add images/editorial/night-session.jpg images/editorial/indoor-session.jpg images/editorial/provenance.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage two reviewed official video thumbnail photographs'
          git push origin HEAD:refs/heads/design/premium-editorial-v1
